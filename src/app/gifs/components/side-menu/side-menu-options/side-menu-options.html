@for (item of menuItems; track item.label) {
  <a
    [routerLink]="item.link || undefined"
    class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
    [class.bg-blue-800]="item.active"
  >
    <div>
      <i
        class="w-6 h-6 text-center leading-6 text-base"
        [class.text-white]="item.active"
        [class]="item.iconClass"
      ></i>
    </div>
    <div class="flex flex-col">
      <span
        class="text-lg font-bold leading-5"
        [class.text-white]="item.active"
        [class.text-slate-300]="!item.active"
      >
        {{ item.label }}
      </span>
      <span class="text-sm text-slate-500 hidden md:block">
        {{ item.description }}
      </span>
    </div>
  </a>
}
<div>
  @for (key of gifsService.searchHistoryKeys(); track key) {
    <a
      [routerLink]="['/dashboard/history', key]"
      class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
    >
      <div>
        <i class="w-6 h-6 text-center leading-6 text-base" [class.text-white]="key" [class]=""></i>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-bold leading-5" [class.text-white]="" [class.text-slate-300]="">
          {{ key }}
        </span>
      </div>
    </a>
  }
</div>
